spring.application.name=oficina_api

# Configuração do banco de dados H2 (arquivo dentro do projeto, pasta DATA)
spring.datasource.url=jdbc:h2:file:./DATA/oficinaapi
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Exibir os comandos SQL no log
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Senha principal usada para assinar/validar o token JWT.
# Lida da variável de ambiente JWT_SECRET; se não existir, usa 12345678 (para rodar localmente).
pw3.senha.principal.geracao.token=${JWT_SECRET:12345678}
